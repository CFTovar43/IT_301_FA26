<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploring HTML Tags</title>
</head>

<body>
    <p> This is a paragraph. <br>
        This is another paragraph.</p>

<hr>

    <!-- correct closing tag for strong element -->
    <p> My cat is <strong>very</strong> grumpy.</p>

    <!-- wrong closing tag for strong element -->
    <p> My cat is <strong> very grumpy. </p></strong>

<hr>

            <h1> Title</h1>
            <h2> Heading</h2>
            <h3> Subsection</h3>
            <h4> Details</h4>

<hr>

<img src="https://i.ytimg.com/vi/SQJrYw1QvSQ/maxresdefault.jpg" alt="A cute cat" width="400" height="300">
</body>

</html>

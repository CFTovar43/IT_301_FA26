<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7: Masonry</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }
       #left {
        width: 100px;
        height: 100vh;
        flex: 0 0 100px;

        display: flex;
        flex-direction: column;
        align-items: center;

        background-color: orange;
        padding-top: 20px;
        }

        #left p {
            font-size: 50px;
            margin: 15px 0;
        }

        #left p:last-child {
            margin-top: auto;
            margin-bottom: 20px;
        }

        #right {
            flex: 1;
            height: 100vh;

            display: flex;
            flex-flow: row wrap;
            align-content: flex-start;
            align-items: flex-start;
            gap: 4px;

            overflow-y: auto;
            overflow-x: hidden;
        }

        #right img {
            height: 100px;
            width: auto;
            flex: 1 1 auto;
            min-width: 0;

            border: 1px solid white;
            object-fit: cover;
        }
    </style>
</head>

<body>
        <div id="left">
            <p>&#x1F4F7;</p>
            <p>&#x1F5C4;&#xfe0f;</p>
            <p>&#x2764;&#xfe0f;</p>
            <p>&#x1F5D1;&#xfe0f;</p>
        </div>

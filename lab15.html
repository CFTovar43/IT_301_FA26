<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        // Task 1
        const site = "https://jsonplaceholder.typicode.com/posts";
        const posts = [];
        const getPost = async () => {
            try {
                let prom = await fetch(site);
                let p = await prom.json();
                for (let post of p) {
                    posts.push(post);
                }
            } catch (error) {
                console.log(error);
            }
        };
        getPost().then(() => {
            console.table(posts);
        });

        // Task 2

        const displayAllPosts = async () => {
            for (let i = 0; i < posts.length; i++) {
                let post = posts[i];

                let postArticle = document.createElement("article");
                document.body.appendChild(postArticle);
                let postTitle = document.createElement("h2");
                let postBody = document.createElement("p");
                postArticle.appendChild(postTitle);
                postArticle.appendChild(postBody);
                let postUserID = document.createElement("p");
                postArticle.appendChild(postUserID);
                let postId = document.createElement("p");
                postArticle.appendChild(postId);

                postTitle.textContent = post.title;
                postBody.textContent = post.body;
                postUserID.textContent = "User ID: " + post.userId;
                postId.textContent = "Post ID: " + post.id;
        };
        }
        getPost().then(() => displayAllPosts());



        // Task 3

        const displayPostsByUser = async () => {
            const userID = document.getElementById("userID").value;
            const userPosts = posts.filter(p => p.userId == userID);
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            for (let post of userPosts) {
                let postArticle = document.createElement("article");
                document.body.appendChild(postArticle);
                let postTitle = document.createElement("h2");
                let postBody = document.createElement("p");
                postArticle.appendChild(postTitle);
                postArticle.appendChild(postBody);
                let postUserID = document.createElement("p");
                postArticle.appendChild(postUserID);
                let postId = document.createElement("p");
                postArticle.appendChild(postId);

                postTitle.textContent = post.title;
                postBody.textContent = post.body;
                postUserID.textContent = "User ID: " + post.userId;
                postId.textContent = "Post ID: " + post.id;
            }
        };
        document.getElementById("filterBtn").addEventListener("click", displayPostsByUser);

        // Task 4
        const filterPostsByUser = async () => {
            const userID = document.getElementById("userID").value;

            const userPosts = posts.filter(p => p.userId == userID);

            console.log(userPosts);
        };

        document.getElementById("filterBtn").addEventListener("click", filterPostsByUser);

        // Task 5

        const displayUserPosts = async () => {
            const userID = document.getElementById("displayUserID").value;

            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });

            const userPosts = posts.filter(p => p.userId == userID);

            for (let post of userPosts) {
                let postArticle = document.createElement("article");
                document.body.appendChild(postArticle);

                let postTitle = document.createElement("h2");
                let postBody = document.createElement("p");

                postArticle.appendChild(postTitle);
                postArticle.appendChild(postBody);

                let postUserID = document.createElement("p");
                postArticle.appendChild(postUserID);

                let postId = document.createElement("p");
                postArticle.appendChild(postId);

                postTitle.textContent = post.title;
                postBody.textContent = post.body;
                postUserID.textContent = "User ID: " + post.userId;
                postId.textContent = "Post ID: " + post.id;
            }
        };

        document.getElementById("displayUserBtn").addEventListener("click", displayUserPosts);

        // Task 6

        const findPost = async () => {
            const postID = document.getElementById("postID").value;
            const post = posts.find(p => p.id == postID);

            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });

            let postArticle = document.createElement("article");
            document.body.appendChild(postArticle);

            let postTitle = document.createElement("h2");
            let postBody = document.createElement("p");
            let postUserID = document.createElement("p");
            let postId = document.createElement("p");

            postArticle.appendChild(postTitle);
            postArticle.appendChild(postBody);
            postArticle.appendChild(postUserID);
            postArticle.appendChild(postId);

            if (post) {
                postTitle.textContent = post.title;
                postBody.textContent = post.body;
                postUserID.textContent = "User ID: " + post.userId;
                postId.textContent = "Post ID: " + post.id;
            } else {
                postTitle.textContent = "Post not found";
                postBody.textContent = "";
                postUserID.textContent = "";
                postId.textContent = "";
            }
        };

        document.getElementById("findBtn").addEventListener("click", findPost);
    </script>

</body>
</html>
